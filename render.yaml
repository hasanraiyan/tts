# Render blueprint for the TTS service (SRS 36).
#
# Deploy with:  render blueprint launch   (or connect the repo in the dashboard)
# Every `sync: false` value is a secret you set in Render's dashboard on first deploy.

services:
  - type: web
    name: ai-tts-service
    runtime: docker
    # Kokoro + PyTorch needs more than the 512MB free tier. 'starter' (1GB) is
    # the minimum that fits; see BENCHMARK.md for measured peak RSS.
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: false

    envVars:
      - key: APP_NAME
        value: ai-tts-service
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # One secret per consuming application. Never commit these.
      - key: API_KEY_DEFAULT
        sync: false
      - key: API_KEY_MINDPAGEREADS
        sync: false
      - key: API_KEY_COURSIFY
        sync: false

      # Hugging Face: only needed for private/gated models.
      - key: HF_TOKEN
        sync: false

      # Model (weights are baked into the image at this exact revision)
      - key: MODEL_ID
        value: hexgrad/Kokoro-82M
      - key: MODEL_REVISION
        value: f3ff3571791e39611d31c381e3a41a3af07b4987
      - key: MODEL_WEIGHTS_FILE
        value: kokoro-v1_0.pth

      # TTS behaviour
      - key: DEFAULT_LANGUAGE
        value: en
      - key: DEFAULT_VOICE
        value: af_heart
      - key: DEFAULT_FORMAT
        value: mp3
      - key: SUPPORTED_FORMATS
        value: mp3,wav
      - key: MAX_TEXT_LENGTH
        value: "5000"
      - key: SAMPLE_RATE
        value: "24000"

      # Runtime / protection
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_CONCURRENCY
        value: "1"
      - key: QUEUE_TIMEOUT_SECONDS
        value: "120"
      - key: TORCH_NUM_THREADS
        value: "4"
      - key: PRELOAD_MODEL
        value: "true"
